---
- name: Install socketcan rule
  ansible.builtin.template:
    src: 80-socketcan.rules.j2
    dest: /etc/udev/rules.d/98-socketcan.rules
    mode: "0644"

- name: Reload udev rules
  ansible.builtin.shell:
    cmd: "udevadm control --reload && udevadm trigger"
  become: true
  changed_when: true
